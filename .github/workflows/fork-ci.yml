# Fork-only CI: run on demand against any branch of this fork.
# gh workflow run fork-ci.yml -R SuperTost100/Z-Sync -f ref=<branch>
name: fork-ci
run-name: fork-ci ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to test
        required: true
      regenerate:
        description: Regenerate the Xcode project with XcodeGen before testing
        type: boolean
        default: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Regenerate project with XcodeGen
        if: ${{ inputs.regenerate }}
        run: |
          brew install xcodegen
          xcodegen
          git diff --stat -- ZenCompanion.xcodeproj || true
      - uses: actions/upload-artifact@v4
        with:
          name: xcodeproj
          path: ios/ZenCompanion.xcodeproj/project.pbxproj
      - name: Test on simulator
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d, reverse=True) if "iOS" in k for x in d[k] if x["name"].startswith("iPhone")))')
          set -o pipefail
          xcodebuild test -project ZenCompanion.xcodeproj -scheme ZenCompanion \
            -destination "id=$SIM" CODE_SIGNING_ALLOWED=NO 2>&1 | tail -200
